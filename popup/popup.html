<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { font: 14px system-ui; width: 260px; margin: 0; padding: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  #status { color: #6b7280; font-size: 12px; margin-bottom: 8px; }
  .switch { position: relative; width: 40px; height: 22px; display: inline-block; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 22px; cursor: pointer; transition: .2s; }
  .slider:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .2s; }
  input:checked + .slider { background: #2563eb; }
  input:checked + .slider:before { transform: translateX(18px); }
</style></head>
<body>
  <div class="row"><strong>ChatDeck</strong></div>
  <div id="status">检查中…</div>
  <div class="row"><span>启用</span>
    <label class="switch"><input type="checkbox" id="toggle"><span class="slider"></span></label>
  </div>
  <div class="row"><span>诊断日志</span>
    <label class="switch"><input type="checkbox" id="debug"><span class="slider"></span></label>
  </div>
  <script src="popup.js"></script>
</body></html>
